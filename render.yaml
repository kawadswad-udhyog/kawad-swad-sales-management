services:
  - type: static
    name: kawad-swad-sales-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kawad-swad-sales-backend.onrender.com

  - type: web
    name: kawad-swad-sales-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SALES_GOOGLE_SPREADSHEET_ID
        sync: false
      - key: SALES_GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/sales-service-account.json
      - key: SALES_JWT_SECRET
        generateValue: true
      - key: SALES_CORS_ORIGINS
        value: https://kawad-swad-sales-frontend.onrender.com,http://localhost:3000
      - key: SALES_ENV
        value: production
      - key: SALES_TOKEN_HOURS
        value: "8"
