services:
  - type: static
    name: kawad-swad-sales-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Configure these rewrite destinations in Render to match your verified production backend service URL (never point production to -dev).
      - type: rewrite
        source: /api/*
        destination: https://REPLACE-WITH-PROD-BACKEND-HOST.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://REPLACE-WITH-PROD-BACKEND-HOST.onrender.com/health
      - type: rewrite
        source: /auth/*
        destination: https://REPLACE-WITH-PROD-BACKEND-HOST.onrender.com/auth/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Leave unset in production when using same-origin Render rewrites, or set explicitly to your production API URL (never -dev).
      - key: VITE_API_URL
        sync: false

  - type: web
    name: kawad-swad-sales-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SALES_GOOGLE_SPREADSHEET_ID
        sync: false
      - key: SALES_GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/sales-service-account.json
      - key: SALES_JWT_SECRET
        generateValue: true
      - key: SALES_CORS_ORIGINS
        value: https://kawad-swad-sales-frontend.onrender.com,http://localhost:3000
      - key: SALES_ENV
        value: production
      - key: SALES_TOKEN_HOURS
        value: "8"
      - key: WEB_CONCURRENCY
        value: "1"
