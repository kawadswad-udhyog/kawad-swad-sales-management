services:
  - type: static
    name: kawad-swad-sales-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kawad-swad-sales-dev.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://kawad-swad-sales-dev.onrender.com/health
      - type: rewrite
        source: /auth/*
        destination: https://kawad-swad-sales-dev.onrender.com/auth/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: kawad-swad-sales-dev
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # TX-AUDIT-02: Persistent Render disk required for host-local SQLite WAL transaction coordinator.
    # Single-instance architecture ONLY (WEB_CONCURRENCY=1, SALES_INSTANCE_COUNT=1):
    # Do NOT scale to multiple containers until distributed coordination / verified Apps Script LockService (DB-008) is deployed.
    disk:
      name: kawad-swad-tx-coord-disk
      mountPath: /var/data/kawad_swad
      sizeGB: 1
    envVars:
      - key: SALES_GOOGLE_SPREADSHEET_ID
        sync: false
      - key: SALES_GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/sales-service-account.json
      - key: SALES_JWT_SECRET
        generateValue: true
      - key: SALES_CORS_ORIGINS
        value: https://kawad-swad-sales-frontend.onrender.com
      - key: SALES_ENV
        value: production
      - key: SALES_TOKEN_HOURS
        value: "8"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SALES_INSTANCE_COUNT
        value: "1"
      - key: TRANSACTION_DB_PATH
        value: /var/data/kawad_swad/kawad_swad_tx_coord.db
      - key: KS_ERP_LOCK_DIR
        value: /var/data/kawad_swad/locks
      - key: KS_ERP_STATE_DIR
        value: /var/data/kawad_swad/state
      - key: SALES_TX_LEASE_SECONDS
        value: "90"
      - key: SALES_APPS_SCRIPT_ENABLED
        value: "true"
      - key: SALES_APPS_SCRIPT_WEBAPP_URL
        sync: false
      - key: SALES_APPS_SCRIPT_SHARED_SECRET
        sync: false
