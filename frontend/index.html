<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kawad Swad Sales</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand">Kawad Swad <small>Sales Management</small></div><span id="who"></span><button id="logout" class="secondary hidden">Sign out</button></header>
<main>
<section id="login" class="card login"><h1>Welcome back</h1><p>Sign in to your sales workspace.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="loginError" class="error"></p></form></section>
<section id="app" class="hidden">
<nav id="nav"><button data-view="dashboard">Dashboard</button><button data-view="products">Products</button><button data-view="customers">Customers</button><button data-view="sales">Sales & Bills</button><button data-view="expenses">Expenses</button><button data-view="visits">Shop Visits</button><button data-view="reports">Reports & Exports</button></nav>
<div id="notice" role="status"></div><section id="view"></section>
</section></main><script src="app.js"></script></body></html>
