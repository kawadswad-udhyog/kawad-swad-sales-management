name: Phase 4.2-A Security Guard Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-4-2a-security-guards]

permissions:
  contents: read

jobs:
  backend-security-tests:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 4.2-A security tests
        env:
          SALES_TESTING: "1"
          SALES_JWT_SECRET: "test-only-secret-do-not-use-for-deployment-32"
        run: python -m unittest tests.test_phase4_2a_security_guards -v

      - name: Run Phase 4 clean-data and production contracts
        env:
          SALES_TESTING: "1"
          SALES_JWT_SECRET: "test-only-secret-do-not-use-for-deployment-32"
        run: python -m unittest tests.test_phase4_clean_data_contracts -v

      - name: Run manufacturing workflow regression suite
        env:
          SALES_TESTING: "1"
          SALES_JWT_SECRET: "test-only-secret-do-not-use-for-deployment-32"
        run: >-
          python -m unittest
          tests.test_recipe_master_v2
          tests.test_production_module
          tests.test_daily_operations_readiness
          tests.test_master_repair_and_readiness
          tests.test_erp_stabilization
          tests.test_raw_material_issuance_recovery
          tests.test_raw_material_receiving_stage1
          -v

  frontend-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run production build (includes TypeScript check)
        run: npm run build
